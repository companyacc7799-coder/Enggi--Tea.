<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ENGGITEA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="main-header">

        <a href="index.html" class="logo">
            ENGGITEA
        </a>

        <a href="index.html" class="back-link">
            ← Home
        </a>

    </header>


    <!-- Register Page -->
    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-heading">

                <div class="auth-icon">
                    ✦
                </div>

                <p class="auth-label">
                    JOIN ENGGITEA
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Start learning Engineering Mathematics today.
                </p>

            </div>


            <!-- Register Form -->
            <form id="registerForm" class="auth-form">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Terms -->
                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to use ENGGITEA responsibly.
                    </span>

                </label>


                <!-- Submit -->
                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                    <span>→</span>
                </button>


                <!-- Message -->
                <div
                    id="registerMessage"
                    class="form-message"
                    role="alert"
                ></div>

            </form>


            <!-- Login -->
            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
