<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email | ENGGITEA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="main-header">

        <a href="index.html" class="logo">
            ENGGITEA
        </a>

        <a href="login.html" class="back-link">
            ← Login
        </a>

    </header>


    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-heading">

                <div class="auth-icon">
                    ✉
                </div>

                <p class="auth-label">
                    VERIFY YOUR EMAIL
                </p>

                <h1>
                    Check Your Inbox
                </h1>

                <p>
                    We have sent a verification link to your email address.
                    Please open it to verify your ENGGITEA account.
                </p>

            </div>


            <div
                id="verificationMessage"
                class="form-message"
                role="status"
                style="color: var(--text-light);"
            >
                Please check your email and click the verification link.
            </div>


            <button
                type="button"
                id="goToLoginBtn"
                class="auth-submit-btn"
            >
                Go to Login
                <span>→</span>
            </button>


            <div class="auth-footer">

                <p>
                    Didn't receive the email?
                    <a href="#" id="resendVerificationBtn">
                        Resend verification email
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>

        const goToLoginBtn =
            document.getElementById("goToLoginBtn");

        const resendVerificationBtn =
            document.getElementById("resendVerificationBtn");

        const message =
            document.getElementById("verificationMessage");


        goToLoginBtn.addEventListener("click", () => {
            window.location.href = "login.html";
        });


        resendVerificationBtn.addEventListener(
            "click",
            async (event) => {

                event.preventDefault();

                const email =
                    localStorage.getItem("pendingVerificationEmail");

                if (!email) {

                    message.textContent =
                        "Please register again to request a new verification email.";

                    return;
                }


                resendVerificationBtn.style.pointerEvents = "none";

                message.textContent =
                    "Sending verification email...";


                try {

                    const { error } =
                        await supabaseClient.auth.resend({
                            type: "signup",
                            email: email,
                            options: {
                                emailRedirectTo:
                                    window.location.origin +
                                    "/login.html"
                            }
                        });


                    if (error) {
                        throw error;
                    }


                    message.textContent =
                        "Verification email sent again. Please check your inbox.";

                } catch (error) {

                    console.error(
                        "Resend verification error:",
                        error
                    );

                    message.textContent =
                        error.message ||
                        "Unable to resend verification email.";

                } finally {

                    setTimeout(() => {

                        resendVerificationBtn.style.pointerEvents =
                            "auto";

                    }, 3000);

                }

            }
        );

    </script>

</body>
</html>
